[package]
name = "ddl-desktop"
version = "0.1.0"
description = "独立、便携的 DDL 月历桌面工具（Tauri + Rust）"
authors = ["zhang"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ddl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
