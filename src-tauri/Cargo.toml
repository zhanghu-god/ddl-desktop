[package]
name = "ddl-desktop"
version = "0.3.9"
description = "独立、便携的 DDL 月历桌面工具（Tauri + Rust）"
authors = ["zhang"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ddl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
