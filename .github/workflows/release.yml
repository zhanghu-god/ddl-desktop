name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的 tag（留空则用最新 Release）'
        required: false

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: zhanghu-god/rust-rewrite }
      - uses: actions/checkout@v4
        with: { repository: zhanghu-god/ddl-desktop, path: ddl-desktop }
      - uses: actions/checkout@v4
        with: { repository: zhanghu-god/push-wp, path: push-wp }
      - uses: actions/checkout@v4
        with: { repository: zhanghu-god/launch-manager, path: launch-manager }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build portable ZIP
        working-directory: ddl-desktop
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ddl-zip
          path: |
            ddl-desktop/release/*_x64-portable.zip
            ddl-desktop/release/SHA256SUMS.txt

  android-apk:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4
        with: { repository: zhanghu-god/rust-rewrite }
      - uses: actions/checkout@v4
        with: { repository: zhanghu-god/ddl-desktop, path: ddl-desktop }
      - uses: actions/checkout@v4
        with: { repository: zhanghu-god/push-wp, path: push-wp }
      - uses: actions/checkout@v4
        with: { repository: zhanghu-god/launch-manager, path: launch-manager }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept licenses & install NDK (preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "ndk;27.0.12077973"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install JS deps
        working-directory: ddl-desktop
        run: npm install
      - name: Build APK (arm64, debug)
        working-directory: ddl-desktop
        run: npx tauri android build --apk --debug --target aarch64 || npx tauri android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: ddl-apk
          path: ddl-desktop/src-tauri/gen/android/app/build/outputs/apk/*/debug/*.apk

  publish:
    needs: [windows-zip, android-apk]
    runs-on: ubuntu-latest
    env:
      GH_REPO: zhanghu-god/ddl-desktop
    steps:
      - uses: actions/download-artifact@v4
        with: { name: ddl-zip, path: dist/zip }
      - uses: actions/download-artifact@v4
        with: { name: ddl-apk, path: dist/apk }
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(gh release view --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release if missing and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" --title "DDL Board $TAG" --notes "CI 自动构建：Windows 便携 ZIP + Android APK" 2>/dev/null || true
          APK="$(find dist/apk -name '*.apk' | head -n1)"
          cp "$APK" dist/zip/ddl-desktop_android-arm64.apk
          gh release upload "$TAG" dist/zip/* --clobber