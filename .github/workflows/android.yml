name: Android APK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ddl-desktop
        uses: actions/checkout@v4
        with:
          path: ws/ddl-desktop
      - name: Checkout workspace root (portable-kit)
        uses: actions/checkout@v4
        with:
          repository: zhanghu-god/rust-rewrite
          path: ws
      - name: Checkout push-wp (workspace member)
        uses: actions/checkout@v4
        with:
          repository: zhanghu-god/push-wp
          path: ws/push-wp
      - name: Checkout launch-manager (workspace member)
        uses: actions/checkout@v4
        with:
          repository: zhanghu-god/launch-manager
          path: ws/launch-manager

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"
      - name: Export NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install JS deps (Tauri CLI)
        working-directory: ws/ddl-desktop
        run: npm install

      - name: Build APK (debug, arm64)
        working-directory: ws/ddl-desktop
        run: npx tauri android build --apk --debug --target aarch64

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(gh release view --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload APK to release
        working-directory: ws/ddl-desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          cp "$apk" ddl-desktop_android-arm64.apk
          gh release upload "${{ steps.tag.outputs.tag }}" ddl-desktop_android-arm64.apk --clobber
